<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hive PMO — project management</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/team-panel.css" />
<style>
  :root{--bg:#0c0f0d;--panel:#121613;--panel2:#0f1411;--line:#242a26;--ink:#e8efe9;--dim:#93a096;--acc:#3ddc84;--warn:#e2b33c;--bad:#e0574b;--gate:#7aa2f7;--quiet:#8b9690;--purple:#b48af9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}



  header{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:7px;flex:0 0 auto}
  .hrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;width:100%}
  .hrow .find{flex:1 1 220px;min-width:0}
  h1{font-size:14px;margin:0;letter-spacing:.3px;white-space:nowrap}
  h1 span{color:var(--dim);font-weight:400}
  .strip{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim);white-space:nowrap}
  .pill b{color:var(--ink)}
  .pill.hot{border-color:var(--gate);color:var(--gate)}


  button.pill.hot{cursor:pointer;background:transparent}
  button.pill.hot:hover{border-color:var(--gate);color:var(--ink)}
  button.pill.hot.on{background:var(--gate);border-color:var(--gate);color:#04101f}
  button.pill.hot.on b{color:#04101f}


  button.pill.arch{cursor:pointer;background:transparent;border-color:#4a3a6b;color:var(--purple)}
  button.pill.arch b{color:var(--purple)}
  button.pill.arch:hover{border-color:var(--purple);color:var(--ink)}
  button.pill.arch.on{background:var(--purple);border-color:var(--purple);color:#160a24}
  button.pill.arch.on b{color:#160a24}
  .spacer{margin-left:auto}
  
  button.go{border-color:var(--acc);color:var(--acc);font-weight:600}
  button.go[disabled]{opacity:.55;cursor:default}
  #stamp{font-variant-numeric:tabular-nums}
  #stamp.bad{color:var(--bad);border-color:var(--bad)}
  input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
  .find{min-width:190px}
  button{cursor:pointer}
  button.acc{background:var(--acc);color:#04120a;border-color:var(--acc);font-weight:600}
  button.gate{background:var(--gate);color:#06101f;border-color:var(--gate);font-weight:600}
  label.sw{color:var(--dim);font-size:12px;display:flex;gap:5px;align-items:center;white-space:nowrap;cursor:pointer}
  .adder{display:none;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;align-items:center}
  .adder.on{display:flex}
  .board{display:flex;gap:10px;padding:12px 14px;overflow:auto;flex:1 1 auto;min-height:0;align-items:flex-start}
  .col{min-width:252px;max-width:252px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .col h2{margin:0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .col h2 em{font-style:normal;color:var(--dim);font-size:11px}
  .col h2 .cnt{font-weight:400;color:var(--dim);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .col h2 .cnt em{font-style:normal;color:var(--dim);font-size:11px}
  .col h2 .cnt b{color:var(--ink);font-weight:600}
  .col .duty{color:var(--dim);font-size:11px;margin:5px 0 2px;min-height:28px}
  .col .agent{font-size:11px;color:var(--acc);margin-bottom:8px}
  .col .agent span{color:var(--dim)}


  .col{position:relative}
  .col.open{min-width:336px;max-width:336px}
  .col h2 .who-open{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:10.5px;padding:1px 8px;font-weight:400;margin-left:6px}
  .col h2 .who-open:hover{color:var(--ink);border-color:var(--dim)}
  .col.open h2 .who-open{color:var(--acc);border-color:#1f4a33}
  .hands{padding:7px 2px 8px;border-bottom:1px dashed var(--line);margin:6px 0 6px}
  .hands .noagent{color:var(--dim);font-size:11.5px;line-height:1.45}
  .hand{display:grid;grid-template-columns:20px 1fr;gap:1px 7px;padding:5px 0}
  .hand + .hand{border-top:1px solid var(--line)}
  .hand .b{grid-row:1 / span 5;padding-top:2px}
  .hand .who{font-size:12px;color:var(--ink)}
  .hand .who span{color:var(--dim)}
  .hand .holds{font-size:11.5px;color:#cbd6cd;overflow-wrap:anywhere}
  .hand .doing{font-size:11.5px;color:var(--dim)}
  .hand .last{font-size:11px;color:#8fa298;overflow-wrap:anywhere}
  .hand .got{font-size:11px;color:var(--dim)}
  .bee{display:block;width:16px;height:16px}
  .bee .wing{fill:#a7b3aa;opacity:.8}
  .bee .body,.bee .head{fill:#6c7a70}
  .bee .legs{stroke:#6c7a70}
  .bee.working .wing{fill:#9ff0c4}
  .bee.working .body,.bee.working .head{fill:var(--acc)}
  .bee.working .legs{stroke:var(--acc)}
  .bee.waiting .wing{fill:#f4dc9a}
  .bee.waiting .body,.bee.waiting .head{fill:var(--warn)}
  .bee.waiting .legs{stroke:var(--warn)}
  .bee .crown{fill:#e8c34a;stroke:#7a6113;stroke-width:.9;stroke-linejoin:round}
  .bee.queen .wing{fill:#f4dc9a}
  .bee.queen .body,.bee.queen .head{fill:#e8c34a}
  .bee.queen .legs{stroke:#e8c34a}
  .pill.atwork{border-color:#4d3f18;color:#e8c34a}
  .pill.atwork b{color:#f4dc9a;font-weight:600}
  .pill.queen{display:flex;gap:6px;align-items:center;border-color:#4d3f18;color:#e8c34a;cursor:pointer;background:transparent;font:inherit}
  .pill.queen b{color:#f4dc9a;font-weight:600}
  .pill.queen svg{width:15px;height:15px}
  
  .pill.queen:disabled{opacity:.55;cursor:wait}
  .pill.queen.on{border-color:#1f4a33;color:var(--acc)}
  .pill.queen.on b{color:var(--acc)}
  .pill.queen.on .bee .wing{fill:#9ff0c4}
  .pill.queen.on .bee .body,.pill.queen.on .bee .head{fill:var(--acc)}
  .pill.queen.on .bee .legs{stroke:var(--acc)}
  .pill.queen.on .bee .crown{fill:#b9ffd9;stroke:#1f4a33}
  .pill.queen.off{border-color:#5a2a2a;color:var(--bad)}
  .pill.queen.off b{color:var(--bad)}
  .pill.queen.off .bee .wing{fill:#f0a0a0}
  .pill.queen.off .bee .body,.pill.queen.off .bee .head{fill:var(--bad)}
  .pill.queen.off .bee .legs{stroke:var(--bad)}
  .pill.queen.off .bee .crown{fill:#ffc9c4;stroke:#5a2a2a}
  .list{padding:8px 14px 24px;overflow-y:auto;flex:1 1 auto;min-height:0}
  .grp{margin:12px 0 4px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);display:flex;gap:10px;align-items:baseline}
  .grp em{font-style:normal;color:#5c6a60}
  .grp .duty{text-transform:none;letter-spacing:0;color:#6c7a70;font-size:11px}
  .row{border:1px solid transparent;border-radius:8px}
  .row:hover{border-color:var(--line);background:var(--panel2)}
  .line{display:flex;gap:9px;align-items:center;padding:4px 7px;cursor:pointer;font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .s-capture{background:#8ab4f8}.s-analyse{background:#c58af9}.s-approved{background:var(--gate)}
  .s-planning{background:#f9d38a}.s-execution{background:#8af9b4}.s-testing{background:#8af9e6}
  .s-red{background:var(--bad)}.s-amber{background:var(--warn)}.s-green{background:var(--acc)}.s-none{background:var(--dim)}
  .s-feedback{background:#f98ac5}.s-done{background:#4a564d}.s-archive{background:#2f3a33}
  .key{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);flex:0 0 auto;width:58px}
  .ttl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--dim);flex:0 0 auto;white-space:nowrap}
  .badge.wait{color:var(--warn);border-color:#4d3f18}
  .badge.amber{color:var(--warn);border-color:#4d3f18}
  .badge.run{color:var(--acc);border-color:#1f4a33}
  .badge.busy{color:var(--warn);border-color:#4d3f18}
  .badge.bad{color:var(--bad);border-color:#5a2a26}



  .badge.you{color:var(--gate);border-color:#2c4a7a}
  .badge.quiet{color:var(--quiet);border-color:#39423c}
  .badge.pink{color:#ff2fa0;border-color:#ff2fa0;background:transparent}
  .prog{font-size:11px;color:var(--dim);width:38px;text-align:right;flex:0 0 auto}
  .chev{color:#5c6a60;flex:0 0 auto;width:12px;font-size:11px}
  .full{display:none;padding:2px 8px 12px 24px;border-top:1px dashed var(--line);font-size:12.5px}
  .row.open .full{display:block}
  .body{white-space:pre-wrap;color:#cbd6cd;margin:8px 0}
  .acts{margin:8px 0}
  .acts div{color:var(--dim)}
  .acts .done{color:var(--acc)}
  .ev{white-space:pre-wrap;color:var(--dim);max-height:220px;overflow:auto;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
  .rowbtn{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .rowbtn button{font-size:11.5px;padding:5px 10px}
  .note{color:var(--gate);font-size:12px;margin:6px 0}
  #peek{position:fixed;z-index:50;display:none;width:380px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:0 12px 34px rgba(0,0,0,.55);pointer-events:none}
  #peek h3{margin:0 0 5px;font-size:13px}
  #peek .meta{color:var(--dim);font-size:11.5px;margin-bottom:7px}
  #peek p{color:#cbd6cd;white-space:pre-wrap;font-size:12px;margin:0;max-height:230px;overflow:hidden}
  footer{padding:7px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;flex:0 0 auto}
  .empty{color:#5c6a60;font-size:12px;padding:4px 0}



  #cardwrap{position:fixed;inset:0;z-index:60;height:100vh;height:100dvh;display:none;background:var(--panel);overscroll-behavior:none}
  #cardwrap.on{display:flex;flex-direction:column}
  #cardbox{position:relative;left:auto;top:auto;transform:none;width:100%;height:100%;max-height:none;background:var(--panel);border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;overflow:hidden}
  #cardbox .chead{display:flex;gap:10px;align-items:center;padding:11px 16px;padding-top:calc(11px + env(safe-area-inset-top));border-bottom:1px solid var(--line);flex:0 0 auto}
  #cardbox .chead h2{margin:0;font-size:15px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #cardbox .chead .meta{color:var(--dim);font-size:11.5px;white-space:nowrap}
  #cardbox .cx{background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 11px;color:var(--dim);font-size:12px}
  #cardbox .cbody{padding:14px 18px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;flex:1 1 auto;min-height:0}
  #cardbox .cbody .body{max-width:82ch;font-size:13px;line-height:1.5}
  #cardbox .cbody .acts{max-width:82ch}
  #cardbox .cbody .ev{max-height:none;overflow:visible;font-size:12px;line-height:1.5;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
  #cardbox .cbody .rowbtn button{font-size:12.5px;padding:7px 13px}
  #cardbox .cbody .word{max-width:82ch;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  #cardbox .cbody .word label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px}
  #cardbox .cbody .word textarea{width:100%;box-sizing:border-box;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.4 ui-sans-serif,system-ui,sans-serif;resize:vertical}
  #cardbox .cbody .word .acc{margin-top:8px;background:var(--acc);color:#06120a;border:0;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600}
  #cardbox .cbody .word .stamp{color:var(--dim);font-size:11px;margin-left:10px}
</style>
</head>
<body>
<header>
  
  <h1>Hive PMO <span>· Project Management</span></h1>
  
  <div class="hrow">
    <button class="pill queen off" id="queen" onclick="queenToggle()" title="the Queen is off - press to turn her on"></button>
    <span class="pill" id="qd" title="seconds to the Queen's next check"><b>·</b> seconds</span>
    <span class="pill atwork" id="aw" title="agents working right now"><b>·</b> agents</span>
    <button class="pill hot" id="waiting" onclick="toggleWaiting()" title="show only what waits on you — press again to see the whole board"><b>0</b> waiting on you</button>
  </div>
  <div class="hrow">
    <button class="pill arch" id="p-done" onclick="toggleDone()" title="press to open the Completed column"><b>Completed</b></button>
    <button class="pill arch" id="p-archive" onclick="toggleArchive()" title="press to open the Archive column"><b>Archive</b></button>
    <button class="pill arch" id="p-trash" onclick="toggleTrash()" title="press to open the Trash column"><b>Trash</b></button>
  </div>
  <div class="hrow">
    <button class="go" id="refresh" onclick="refreshNow()" title="Read the board again now">↻ Refresh</button>
    <span class="pill" id="stamp">not read yet</span>
  </div>
  <div class="hrow">
    <input class="find" id="find" placeholder="enter the number" oninput="render()" />
  </div>
  <div class="hrow">
    <button onclick="document.getElementById('adder').classList.toggle('on')">+ add a card</button>
  </div>
</header>

<div class="adder" id="adder">
  <input id="title" placeholder="What is it? One line." style="min-width:300px" />
  <input id="body" placeholder="What is known about it (optional)" style="min-width:340px" />
  


  <label class="serie">Series
    <select id="series">
      <option value="WO" selected>WO — the owner's work order</option>
      <option value="CW">CW — the agent's work</option>
    </select>
  </label>
  <button class="acc" onclick="create()">Land it on the board</button>
</div>

<div class="board" id="board"></div>
<div id="cardwrap" onclick="closeCard()"><div id="cardbox" onclick="event.stopPropagation()"></div></div>
<div id="peek"></div>
<style>
@keyframes hivespin { to { transform: rotate(360deg); } }
@keyframes hivepulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.jd-spin { display:inline-block; width:10px; height:10px; border:2px solid #4fd08a; border-right-color:transparent; border-radius:50%; animation: hivespin .9s linear infinite; vertical-align:-1px }
.jd-wait { display:inline-block; width:10px; height:10px; border:2px solid #6b6b80; border-radius:50%; vertical-align:-1px }
.jd-ok { display:inline-block; width:10px; height:10px; background:#3fbf7f; border-radius:3px; vertical-align:-1px }
.jd-bad { display:inline-block; width:10px; height:10px; background:#e05260; border-radius:3px; vertical-align:-1px }
.jd-seg-run { background:linear-gradient(90deg,#4fd08a,#2f7a52,#4fd08a); background-size:200% 100%; animation: hivespin 2.4s linear infinite }
.jd-seg-run { animation: hivepulse 1.4s ease-in-out infinite }
</style>
<div id="teamscreen" style="display:none; position:fixed; inset:0; z-index:70; background:rgba(10,10,14,.72)">
  <div id="teambody" style="position:absolute; top:3vh; left:50%; transform:translateX(-50%); width:min(1100px,94vw); max-height:94vh; overflow:auto; background:#14141b; border:1px solid #2d2d3a; border-radius:14px; padding:18px 20px; color:#e8e8ef"></div>
</div>
<footer id="foot">the gate is yours — nothing passes the Approved column but by </footer>

<script>
let S = { stages: [], cards: [], binned: [], waiting: 0 };
let onlyMine = false;
let showCompleted = false;
let showArchive = false;
let showTrash = false;
let openId = null;

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const when = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
};
const stage = (k) => S.stages.find((s) => s.key === k) || { name: k, agent: '', duty: '', engine: '', where: '', who: '' };

function bee(state, label) {
  return `<svg class="bee ${state}" viewBox="0 0 24 24" role="img" aria-label="${esc(label)}">
    ${state === 'queen' ? '<path class="crown" d="M9.2 6 10.6 3.3 12 5.2 13.4 3.3 14.8 6 9.2 6Z"/>' : ''}
    <ellipse class="wing" cx="7.7" cy="8.3" rx="4.5" ry="2.6" transform="rotate(-26 7.7 8.3)"/>
    <ellipse class="wing" cx="16.3" cy="8.3" rx="4.5" ry="2.6" transform="rotate(26 16.3 8.3)"/>
    <ellipse class="body" cx="12" cy="14.3" rx="4.9" ry="6.1"/>
    <path d="M7.9 12.6h8.2M8.1 16.2h7.8" stroke="#0c0f0d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle class="head" cx="12" cy="7.2" r="2.5"/>
    <path class="legs" d="M10.7 5.2 9.4 3.4M13.3 5.2l1.3-1.8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </svg>`;
}

function colHands(st, cardsInCol) {
  const live = cardsInCol.filter((c) => !c.binnedAt);
  if (st.engine === 'none') {
    const why = st.key === 'approved'
      ? (live.length ? `${live.length} card(s) stand in this column and wait on your word. No agent works here.` : 'Nothing waits on you in this column. No agent works here.')
      : st.key === 'archive'
        ? 'Completed cards rest here. No agent works this column.'
        : 'The board moves a card into this column by itself. No agent works here.';
    return `<div class="hands"><div class="noagent">${esc(why)}</div></div>`;
  }
  const hands = live.filter((c) => c.running);
  if (!hands.length) {
    const waits = live.filter((c) => isGate(c) || c.held || c.failedAt || c.parkedAt);
    const line = waits.length
      ? `waiting — ${waits.length} card(s) here wait on you, or on another card, or on a repair`
      : 'standing — no card in its hand this minute';
    return `<div class="hands"><div class="hand">
      <span class="b">${bee(waits.length ? 'waiting' : 'standing', waits.length ? 'the worker bee stands, its cards wait' : 'the worker bee stands')}</span>
      <div class="who"><b>worker bee</b> <span>· ${esc(st.agent)}</span></div>
      <div class="doing">${esc(line)}</div>
      <div class="got">${live.length} card(s) stand in this column</div>
    </div></div>`;
  }
  return `<div class="hands">${hands.map((c) => {
    const acts = c.actions || [];
    const prog = acts.length
      ? `${acts.filter((a) => a.done).length} of ${acts.length} actions done`
      : ((c.stageDone || {})[c.stage] ? 'the stage is done' : 'no list of actions on this card');
    const last = (c.activity && c.activity.length) ? c.activity[c.activity.length - 1] : null;
    return `<div class="hand">
      <span class="b">${bee('working', 'the worker bee is working')}</span>
      <div class="who"><b>worker bee ${esc(c.hand || '')}</b> <span>· ${esc(st.agent)}</span></div>
      <div class="holds">holds ${esc(c.key || '#' + c.id)} — ${esc(c.title)}</div>
      <div class="doing">doing ${esc(st.name)}: ${esc(st.duty)}</div>
      ${last ? `<div class="last">last word on the card, ${esc(when(last.at))}: ${esc(last.text)}</div>` : ''}
      <div class="got">got: ${esc(prog)}</div>
    </div>`;
  }).join('')}${live.length > hands.length ? `<div class="noagent">${live.length - hands.length} more card(s) in this column stand unheld.</div>` : ''}</div>`;
}

let openCols = new Set();
function toggleCol(key, e) {
  if (e) e.stopPropagation();
  openCols.has(key) ? openCols.delete(key) : openCols.add(key);
  render();
}

function badge(c) {
  if (c.pinkAt) return '<span class="badge pink">pink - waiting on you</span>';
  if (c.stage === 'archive') return '<span class="badge quiet">archived</span>';
  if (c.kind === 'project') {
    const rag = c.rag || 'NOT STATED';
    const cls = rag === 'RED' ? 'bad' : rag === 'AMBER' ? 'amber' : rag === 'GREEN' ? 'run' : 'quiet';
    return '<span class="badge ' + cls + '">' + esc(rag.toLowerCase()) + '</span>';
  }
  if (c.binnedAt) return '<span class="badge quiet">trashed</span>';
  if (c.parkedAt) return '<span class="badge quiet">not now</span>';
  if (c.failedAt) return '<span class="badge bad">failed</span>';
  if (c.held) return '<span class="badge you">waits on ' + esc((c.waitingOn || []).join(', ')) + '</span>';
  if (c.running) return '<span class="badge run">agent working</span>';

    tasks.forEach((x) => {
      if (x.assignee !== name) return;
      if (x.status !== 'completed' && x.status !== 'failed' && x.status !== 'cancelled') return;
      const t = stampOf(x.updatedAt);
      if (!Number.isFinite(t) || t <= 0) return;
      if (latest === undefined || t > latest) latest = t;
    });
    return latest;
  };
  const orderMembers = (members, tasks) => {
    const live = [];
    const stamped = [];
    const rest = [];
    members.forEach((m, i) => {
      if (memberIsRunning(m, tasks)) { live.push({ m, i }); return; }
      const at = finishedAt(m.name, tasks);
      if (at === undefined) rest.push({ m, i }); else stamped.push({ m, i, at });
    });
    stamped.sort((a, b) => b.at - a.at || a.i - b.i);
    return live.concat(stamped, rest).map((e) => e.m);
  };
  const memberStateLabel = (m, tasks) => {
    const owned = tasks.filter((x) => x.assignee === m.name);
    if (m.activity === 'working' || m.status === 'working') return 'Working';
    if (owned.some((x) => x.status === 'failed')) return 'Has failures';
    if (owned.some((x) => toneOf(x, tasks) === 'blocked')) return 'Waiting';
    if (owned.length > 0 && owned.every((x) => x.status === 'completed')) return 'Delivered';
    if (m.status === 'removed') return 'Removed';
    if (owned.length > 0) return 'Pending';
    return 'Awaiting assignment';
  };
  const memberStatusText = (m, tasks) => {
    const owned = tasks.filter((x) => x.assignee === m.name);
    const current = owned.find((x) => x.id === m.currentTask);
    const blocked = owned.find((x) => toneOf(x, tasks) === 'blocked');
    if ((m.activity === 'working' || m.status === 'working') && current) {
      const model = route(m);
      return model === '' ? `Working on ${current.id}` : `Working on ${current.id} · ${model}`;
    }
    if (m.activity === 'working' || m.status === 'working') return 'Working on assigned tasks';
    if (blocked) {
      const dependency = tasks.find((x) => (blocked.dependencies || []).includes(x.id) && x.status !== 'completed');
      if (dependency) return `Waiting for ${dependency.id} · ${dependency.assignee || 'Unclaimed'}`;
      return 'Waiting for prerequisites';
    }
    if (!m.total) return 'Waiting for the captain to assign work';
    if (m.done === m.total) return 'Tasks delivered';
    if (owned.some((x) => x.status === 'failed')) return 'Failed; awaiting an explicit retry';
    if (owned.length > 0 && owned.every((x) => x.status === 'completed' || x.status === 'cancelled')) return 'All assigned work is settled';
    return m.activity === 'idle' ? 'Ready to continue' : 'Status unknown';
  };
  const taskSummary = (t) => {
    const tasks = t.tasks || [];
    if (stopped) return tasks.length ? 'The run has stopped; the record below is as it was left' : 'The run has stopped and left no task';
    if (!tasks.length) return 'Waiting for the captain to break down the work';
    const delivered = tasks.filter((x) => x.status === 'completed').length;
    const cancelled = tasks.filter((x) => x.status === 'cancelled').length;
    const failed = tasks.filter((x) => x.status === 'failed').length;
    const liveIds = tasks.filter((x) => toneOf(x, tasks) === 'running').map((x) => x.id);
    const blockedIds = tasks.filter((x) => toneOf(x, tasks) === 'blocked').map((x) => x.id);
    const readyIds = tasks.filter((x) => toneOf(x, tasks) === 'open').map((x) => x.id);
    if (delivered === tasks.length) return `All ${delivered} tasks delivered`;
    if (delivered + cancelled + failed === tasks.length) return `Final: ${delivered} delivered · ${cancelled} cancelled · ${failed} failed`;
    if (failed > 0 && !liveIds.length && !readyIds.length && !blockedIds.length) return `${failed} failed; the automatic loop has stopped`;
    if (blockedIds.length && liveIds.length) return `${blockedIds.slice(0, 3).join(', ')}${blockedIds.length > 3 ? ` and ${blockedIds.length - 3} more` : ''} waiting on prerequisites; other work has started`;
    if (liveIds.length) return `${liveIds.join(', ')} in progress`;
    if (readyIds.length) return `${readyIds.join(', ')} ready to start`;
    if (blockedIds.length) return `${blockedIds.join(', ')} waiting on prerequisites`;
    return 'Waiting for the next scheduling round';
  };

  const body = document.getElementById('teambody');
  const sameCard = !!body && body.getAttribute('data-card') === String(id);
  const openFolds = {};
  const pickedByTeam = {};
  const foldedByTeam = {};
  if (sameCard) {
    document.querySelectorAll('#teambody details[open]').forEach((d) => {
      const k = d.getAttribute('data-keep');
      if (k) openFolds[k] = true;
    });
    document.querySelectorAll('#teambody .aYQbCq_dependencySection').forEach((s) => {
      const team = s.getAttribute('data-team');
      const pick = s.getAttribute('data-picked');
      if (team && pick) pickedByTeam[team] = pick;
      if (team && s.getAttribute('data-folded') === '1') foldedByTeam[team] = true;
    });
  }

  const pickDetail = (t) => {
    const tasks = t.tasks || [];
    if (!tasks.length) return '';
    const kept = pickedByTeam[String(t.name || '')];
    if (kept && tasks.some((x) => x.id === kept)) return kept;
    const blocked = tasks.find((x) => toneOf(x, tasks) === 'blocked');
    const live = tasks.find((x) => toneOf(x, tasks) === 'running');
    return (blocked || live || tasks[0]).id;
  };

  const captainNode = (t) => {
    const members = t.members || [];
    const tasks = t.tasks || [];
    const busy = stopped ? 0 : members.filter((m) => m.activity === 'working' || m.status === 'working').length;
    const assigned = tasks.filter((x) => x.assignee && x.assignee !== 'captain').length;
    const captainOwned = tasks.filter((x) => x.assignee === 'captain' && x.status !== 'completed' && x.status !== 'failed' && x.status !== 'cancelled');
    const delivered = tasks.filter((x) => x.status === 'completed').length;
    const settled = tasks.length > 0 && tasks.every((x) => x.status === 'completed' || x.status === 'failed' || x.status === 'cancelled');
    const state = stopped ? 'Team stopped'
      : busy > 0 ? `${busy} active`
        : tasks.length > 0 && delivered === tasks.length ? 'All reports received'
          : settled ? 'Settled' : 'Waiting for reports';
    const summary = captainOwned.length
      ? `Assigned ${plural(assigned, 'task')} to members · Captain owns ${list(captainOwned.map((x) => x.id))}`
      : `Assigned ${plural(assigned, 'task')} to ${plural(members.length, 'member')}`;
    return `<div class="aYQbCq_captainNode">
            <span class="aYQbCq_captainAvatar"><span class="aYQbCq_memberInitial" style="background:${accentOf(t.name)};font-size:20px">👑</span></span>
            <span class="aYQbCq_captainInfo">

  const progressOverview = (t) => {

    const liveN = stopped ? 0 : tasks.filter((x) => toneOf(x, tasks) === 'running').length;
    const blockedN = tasks.filter((x) => toneOf(x, tasks) === 'blocked').length;

    const settled = tasks.length > 0 && tasks.every((x) => x.status === 'completed' || x.status === 'failed' || x.status === 'cancelled');
    const ended = tasks.some((x) => x.status === 'failed' || x.status === 'cancelled');

            <span class="aYQbCq_progressLegend"><span data-state="running">■ In progress ${liveN}</span><span data-state="blocked">■ Waiting ${blockedN}</span><span data-state="completed">■ Delivered ${delivered}</span></span>
            <span class="aYQbCq_progressSummary" data-state="${summaryState}"><span class="aYQbCq_progressSummaryDot"></span><span>${esc2(taskSummary(t))}</span></span>
          </section>`;
  };

  const memberBlock = (t, m) => {
    const tasks = t.tasks || [];

      : '<span class="aYQbCq_taskEmpty">No tasks</span>';
    const act = stopped ? 'idle'

    const stateText = stopped ? 'Stopped' : memberStateLabel(m, tasks);
    const statusText = stopped ? 'Team stopped; explicit resume required' : memberStatusText(m, tasks);
    const jump = 'var h=this.getAttribute(\'data-jump\');var s=this.closest(\'.aYQbCq_team\');if(!s)return;'
      + 'var n=h?s.querySelector(\'[data-task-id="\'+h+\'"]\'):s.querySelector(\'.aYQbCq_dagViewport\');'
      + 'if(n){n.scrollIntoView({block:\'center\'});if(n.focus)n.focus();}';
    return `<div class="aYQbCq_memberBlock" data-activity="${act}">
            <span class="aYQbCq_memberBranch" aria-hidden="true"><span></span></span>

              <span class="aYQbCq_memberAvatar"><span class="aYQbCq_memberInitial" style="background:${accentOf(m.name)};font-size:19px">🐝</span></span>
              <span class="aYQbCq_memberInfo">
                <span class="aYQbCq_memberLine">
                  <span class="aYQbCq_memberName">${esc2(m.name)}</span>
                  ${m.role ? `<span class="aYQbCq_memberRole">${esc2(m.role)}</span>` : ''}
                  ${r !== '' ? `<span class="aYQbCq_memberModel" title="${escA(r)}" aria-label="${escA(r)}">${esc2(sm)}</span>` : ''}
                  <span class="aYQbCq_memberState" data-activity="${act}">${workGlyph(act === 'working')}${esc2(stateText)}</span>
                </span>
                <span class="aYQbCq_memberStatusLine">${esc2(statusText)}</span>
              </span>
              <span class="aYQbCq_memberCount" title="${escA(String(m.progress == null ? 0 : m.progress))}% delivered">${esc2(String(m.done == null ? 0 : m.done))}/${esc2(String(m.total == null ? 0 : m.total))}</span>
            </button>
            <div class="aYQbCq_assignmentLine">
              <span class="aYQbCq_assignmentLabel">Queen assigned</span>
              <span class="aYQbCq_assignmentTasks">${chips}</span>
            </div>
          </div>`;
  };

  const membersBlock = (t) => {
    const members = t.members || [];
    const tasks = t.tasks || [];
    const openKey = 'members|' + String(t.name || '');
    const isOpen = !!openFolds[openKey];
    const ordered = orderMembers(members, tasks);
    const live = ordered.filter((m) => memberIsRunning(m, tasks));
    const visible = isOpen ? ordered : live;
    const hiddenFinished = ordered.length - visible.length;
    const expandLabel = isOpen ? 'Collapse' : hiddenFinished > 0 ? `Show finished (${hiddenFinished})` : 'Expand';
    const tree = members.length === 0
      ? '<div class="aYQbCq_delegationTree"><span class="aYQbCq_emptyHint">No members yet; waiting for the captain to assemble the team</span></div>'
      : (isOpen || visible.length > 0 ? `<div class="aYQbCq_delegationTree">${visible.map((m) => memberBlock(t, m)).join('')}</div>` : '');
    return `<div class="aYQbCq_members">
            <details data-keep="${escA(openKey)}"${isOpen ? ' open' : ''}>
              <summary class="aYQbCq_membersToggle" style="list-style:none"><span>${chevron(isOpen)}Members ${members.length}</span><span>${esc2(expandLabel)}</span></summary>
              ${tree}
            </details>
          </div>`;
  };

  const taskDetailBox = (t, x, selected, folded) => {
    const tasks = t.tasks || [];
    const waitingOn = (x.dependencies || []).filter((d) => {
      const p = tasks.find((y) => y.id === d);
      return !!p && p.status !== 'completed';
    });
    const dependents = Array.isArray(x.unlocks) && x.unlocks.length
      ? x.unlocks
      : tasks.filter((y) => (y.dependencies || []).includes(x.id)).map((y) => y.id);
    const line = x.status === 'completed' ? 'Completed and delivered'
      : x.status === 'cancelled' ? 'Cancelled; execution will not continue'
        : x.status === 'failed' ? 'Failed; awaiting an explicit retry'
          : !(x.dependencies || []).length ? 'No prerequisites; ready to start'
            : waitingOn.length === 0 ? 'Prerequisites ready; can start'
              : `Waiting for ${list(waitingOn)}`;
    return `<section class="aYQbCq_taskDetail" data-task-detail="${escA(x.id)}" data-deps-body="box" data-on="${selected ? '1' : '0'}"${selected && !folded ? '' : ' style="display:none"'}>
              <span class="aYQbCq_taskDetailHead">
                <span class="aYQbCq_taskDetailId">${esc2(x.id)}</span>
                <span class="aYQbCq_taskDetailSubject" title="${escA(String(x.subject || ''))}">${esc2(String(x.subject || ''))}</span>
                <span class="aYQbCq_taskDetailBadge" data-state="${toneOf(x, t.tasks || [])}">${esc2(statusLabel(x.status))}</span>
              </span>
              <span class="aYQbCq_taskDetailLine">${esc2(x.assignee || 'Unclaimed')} · ${esc2(line)}</span>
              <span class="aYQbCq_taskDetailMeta">${esc2(dependents.length ? 'Unlocks ' + dependents.join(', ') + ' when complete' : 'No downstream tasks')}</span>
              <span class="aYQbCq_taskDetailMeta">attempt ${esc2(String(x.attempt == null ? 0 : x.attempt))} · depth ${esc2(String(x.depth == null ? 0 : x.depth))} · last moved ${esc2(when(x.updatedAt))}</span>
              ${x.output ? `<span class="aYQbCq_taskDetailLine" style="white-space:pre-wrap;max-height:150px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px">${esc2(String(x.output))}</span>` : ''}
            </section>`;
  };

  const taskStages = (tasks) => {
    const byDepth = new Map();
    tasks.forEach((x) => {
      const depth = Number.isFinite(x.depth) ? Math.max(0, Math.floor(x.depth)) : 0;
      const stage = byDepth.get(depth) || [];
      stage.push(x);
      byDepth.set(depth, stage);
    });
    return [...byDepth.entries()].sort((a, b) => a[0] - b[0]).map(([depth, stageTasks]) => ({
      depth,
      tasks: stageTasks.slice().sort((a, b) => String(a.id).localeCompare(String(b.id), 'en', { numeric: true })),
    }));
  };
  const dagLayout = (tasks) => {
    const nodeWidth = 92;
    const nodeHeight = 30;
    const columnGap = 26;
    const rowGap = 8;
    const stages = taskStages(tasks);
    const positions = new Map();
    const nodes = [];
    stages.forEach((stage, column) => {
      stage.tasks.forEach((task, row) => {
        const x = column * (nodeWidth + columnGap);
        const y = row * (nodeHeight + rowGap);
        positions.set(task.id, { x, y });
        nodes.push({ task, x, y });
      });
    });
    const edges = [];
    tasks.forEach((task) => {
      const target = positions.get(task.id);
      if (!target) return;
      (task.dependencies || []).forEach((d) => {
        const source = positions.get(d);
        if (!source) return;
        const x1 = source.x + nodeWidth;
        const y1 = source.y + nodeHeight / 2;
        const x2 = target.x;
        const y2 = target.y + nodeHeight / 2;
        edges.push({ from: d, to: task.id, path: `M${x1} ${y1}C${x1 + 14} ${y1},${x2 - 14} ${y2},${x2} ${y2}` });
      });
    });
    const rows = Math.max(1, ...stages.map((stage) => stage.tasks.length));
    return {
      width: stages.length === 0 ? 0 : stages.length * nodeWidth + (stages.length - 1) * columnGap,
      height: stages.length === 0 ? 0 : rows * nodeHeight + (rows - 1) * rowGap,
      nodeWidth, nodeHeight, nodes, edges,
    };
  };
  const gridIsParallel = (tasks) => {
    if (!tasks.length) return false;
    const ids = new Set(tasks.map((x) => x.id));
    return tasks.every((x) => (x.dependencies || []).every((d) => !ids.has(d)));
  };
  const chainOf = (taskId, tasks) => {
    const byId = new Map(tasks.map((x) => [x.id, x]));
    const related = new Set();
    if (!byId.has(taskId)) return related;
    const dependents = new Map();
    tasks.forEach((x) => (x.dependencies || []).forEach((d) => {
      const list = dependents.get(d) || [];
      list.push(x.id);
      dependents.set(d, list);
    }));
    const upSeen = new Set();
    const downSeen = new Set();
    const up = (tid) => {
      if (upSeen.has(tid)) return;
      upSeen.add(tid);
      related.add(tid);
      const node = byId.get(tid);
      ((node && node.dependencies) || []).forEach(up);
    };
    const down = (tid) => {
      if (downSeen.has(tid)) return;
      downSeen.add(tid);
      related.add(tid);
      (dependents.get(tid) || []).forEach(down);
    };
    up(taskId);
    down(taskId);
    return related;
  };
  const paintJs = (nodeExpr) => 'var n=' + nodeExpr + ';'
    + 'var s=(n||this).closest(\'.aYQbCq_dependencySection\');if(!s)return;'
    + 'var c=n?(n.getAttribute(\'data-chain\')||\'\'):\'\';var k=c?(\' \'+c+\' \'):\'\';'
    + 'var g=s.querySelectorAll(\'.aYQbCq_dagNode\');for(var i=0;i<g.length;i++){var id=g[i].getAttribute(\'data-task-id\');'
    + 'var on=k.indexOf(\' \'+id+\' \')!==-1;'
    + 'g[i].setAttribute(\'data-focused\',(on&&k)?\'true\':\'false\');'
    + 'g[i].setAttribute(\'data-dimmed\',(k&&!on)?\'true\':\'false\');}'
    + 'var p=s.querySelectorAll(\'.aYQbCq_dagEdges path\');for(var j=0;j<p.length;j++){'
    + 'var f=p[j].getAttribute(\'data-from\');var to=p[j].getAttribute(\'data-to\');'
    + 'var live=k.indexOf(\' \'+f+\' \')!==-1&&k.indexOf(\' \'+to+\' \')!==-1;'
    + 'p[j].setAttribute(\'data-active\',live?\'true\':\'false\');'
    + 'p[j].setAttribute(\'data-dimmed\',(k&&!live)?\'true\':\'false\');}';

  const dependencySection = (t) => {
    const tasks = t.tasks || [];
    if (!tasks.length) return '';
    const teamKey = String(t.name || '');
    const parallel = gridIsParallel(tasks);
    const isOpen = !foldedByTeam[teamKey];
    const title = parallel ? 'Parallel tasks' : 'Task dependencies';
    const hint = parallel ? 'No dependencies · Click for details' : 'Hover to highlight dependencies · Click to pin';
    const selected = pickDetail(t);
    const picked = pickedByTeam[teamKey] && tasks.some((x) => x.id === pickedByTeam[teamKey]) ? pickedByTeam[teamKey] : '';
    const chain = picked ? chainOf(picked, tasks) : new Set();
    const layout = dagLayout(tasks);
    const at = new Map(layout.nodes.map((n) => [n.task.id, n]));
    const pick = 'var s=this.closest(\'.aYQbCq_dependencySection\');if(!s)return;var id=this.getAttribute(\'data-task-id\');'
      + 'var d=s.querySelectorAll(\'[data-task-detail]\');for(var i=0;i<d.length;i++){d[i].style.display=\'none\';}'
      + 'var f=s.querySelector(\'[data-task-detail="\'+id+\'"]\');if(f){f.style.display=\'flex\';}'
      + 'var g=s.querySelectorAll(\'.aYQbCq_dagNode\');for(var j=0;j<g.length;j++){g[j].setAttribute(\'aria-pressed\',g[j]===this?\'true\':\'false\');}'
      + 's.setAttribute(\'data-picked\',id);'
      + paintJs('this');
    const hoverIn = paintJs('(event.target.closest?event.target.closest(\'.aYQbCq_dagNode\'):null)');
    const hoverOut = paintJs('(this.querySelector?this.querySelector(\'[aria-pressed="true"]\'):null)');
    const fold = 'var s=this.closest(\'.aYQbCq_dependencySection\');if(!s)return;'
      + 'var b=s.querySelectorAll(\'[data-deps-body]\');if(!b.length)return;'
      + 'var shut=b[0].style.display===\'none\';'
      + 'for(var i=0;i<b.length;i++){var k=b[i].getAttribute(\'data-deps-body\');'
      + 'b[i].style.display=shut?(k===\'box\'?(b[i].getAttribute(\'data-on\')===\'1\'?\'flex\':\'none\'):\'\'):\'none\';}'
      + 'this.setAttribute(\'aria-expanded\',shut?\'true\':\'false\');'
      + 'var c=this.querySelector(\'.aYQbCq_chevron\');if(c)c.setAttribute(\'data-open\',shut?\'true\':\'false\');'
      + 's.setAttribute(\'data-folded\',shut?\'\':\'1\');';
    const nodes = tasks.map((x) => {
      const spot = at.get(x.id);
      const place = parallel || !spot ? '' : ` style="left:${spot.x}px;top:${spot.y}px;width:${layout.nodeWidth}px;height:${layout.nodeHeight}px"`;
      const inChain = chain.has(x.id);
      const chainAttr = ` data-chain="${escA([...chainOf(x.id, tasks)].join(' '))}"`;
      return `<button type="button" class="aYQbCq_dagNode" data-task-id="${escA(x.id)}" data-state="${toneOf(x, tasks)}" aria-pressed="${x.id === selected ? 'true' : 'false'}" data-focused="${chain.size && inChain ? 'true' : 'false'}" data-dimmed="${chain.size && !inChain ? 'true' : 'false'}"${chainAttr} title="${escA(x.id)} · ${escA(String(x.subject || ''))} · ${escA(statusLabel(x.status))}" onclick="${escA(pick)}"${place}>
              <span class="aYQbCq_dagNodeHead"><span class="aYQbCq_dagNodeDot"></span>${esc2(x.id)}</span>
              <span class="aYQbCq_dagNodeLabel">${esc2(compactTaskLabel(x.subject))}</span>
              ${toneOf(x, tasks) === 'running' && !stopped ? `<span class="aYQbCq_dagRunningState" aria-label="Running">${workGlyph(true)}</span>` : ''}
            </button>`;
    }).join('');
    const edgeLayer = parallel ? '' : `<svg class="aYQbCq_dagEdges" width="${layout.width}" height="${layout.height}" aria-hidden="true">${layout.edges.map((e) => {
      const live = chain.size > 0 && chain.has(e.from) && chain.has(e.to);
      return `<path d="${e.path}" data-from="${escA(e.from)}" data-to="${escA(e.to)}" data-active="${live ? 'true' : 'false'}" data-dimmed="${chain.size > 0 && !live ? 'true' : 'false'}"></path>`;
    }).join('')}</svg>`;
    const canvas = `<div class="aYQbCq_dagCanvas" data-layout="${parallel ? 'parallel' : 'dependency'}"${parallel ? '' : ` style="width:${layout.width}px;height:${layout.height}px"`} onmouseover="${escA(hoverIn)}" onmouseout="${escA(hoverOut)}">${edgeLayer}${nodes}</div>`;
    const boxes = tasks.map((x) => taskDetailBox(t, x, x.id === selected, !isOpen)).join('');
    return `<section class="aYQbCq_dependencySection" aria-label="Task dependency chain" data-dependency-map="true" data-team="${escA(t.name)}" data-picked="${picked ? escA(picked) : ''}"${isOpen ? '' : ' data-folded="1"'}>
            <header class="aYQbCq_sectionHead">
              <button type="button" class="aYQbCq_sectionToggleTitle" aria-expanded="${isOpen ? 'true' : 'false'}" onclick="${escA(fold)}">${chevron(isOpen)}<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 2.5v11"></path><path d="M5 6.5h3.2A3.3 3.3 0 0 1 11.5 9.8v3.7"></path></svg> ${esc2(title)}</button>
              <span class="aYQbCq_sectionHint">${esc2(hint)}</span>
            </header>
            <div class="aYQbCq_dagViewport" data-deps-body="viewport"${isOpen ? '' : ' style="display:none"'}>${canvas}</div>
            ${boxes}
          </section>`;
  };

  const teamSection = (t) => {
    const tasks = t.tasks || [];
    const members = t.members || [];
    const delivered = tasks.filter((x) => x.status === 'completed').length;
    const unread = Number(t.inbox || 0);
    const pill = stopped ? '<span class="aYQbCq_historicPill">Stopped</span>'
      : t.phase === 'staged' ? '<span class="aYQbCq_historicPill">Awaiting approval</span>' : '';
    return `<section class="aYQbCq_team" data-team-id="${escA(t.name)}">
          <header class="aYQbCq_teamHead">
            <span class="aYQbCq_teamName" title="${escA(t.name)}">${esc2(t.name)}</span>
            ${pill}
            <span class="aYQbCq_teamStats">
              <span data-stat="members">${plural(members.length, 'member')}</span>
              <span data-stat="tasks">${delivered}/${tasks.length} completed</span>
              <span data-stat="messages">${plural(unread, 'message')}</span>
            </span>
            ${unread > 0 ? `<span class="aYQbCq_unreadPill">${unread} unread</span>` : ''}
          </header>
          <section class="aYQbCq_delegationSection" aria-label="Queen and her worker bees" data-delegation-map="true">
            ${captainNode(t)}
            ${progressOverview(t)}
            ${membersBlock(t)}
          </section>
          ${dependencySection(t)}
        </section>`;
  };

  const currentTeam = teams.filter((t) => t.current);
  const picked = currentTeam.length ? currentTeam : teams.slice(0, 1);
  const earlier = Math.max(teams.length - picked.length, Number(data.earlierRuns || 0));
  const thinNow = !stopped && !readError && picked.length > 0 && picked.every((t) => {
    const ms = t.members || [];
    const ts = t.tasks || [];
    return !ms.some((m) => m.activity === 'working' || m.status === 'working')
      && !ts.some((x) => toneOf(x, ts) === 'running');
  });
  const thinLine = thinNow
    ? `<div style="margin-top:8px;background:#2a2113;color:#e0b452;border-radius:8px;padding:8px 10px;font-size:13px">The team record on the disk is behind this minute: it shows no bee at work. The card itself says ${esc2(handNow || 'a hand')} is working the ${esc2(stageNow || 'stage')} stage${agentNow ? ' (' + esc2(agentNow) + ')' : ''} — ${esc2(holdsNow)}.</div>`
    : '';
  const rows = picked.map(teamSection).join('') + thinLine;
  const earlierLine = earlier
    ? `<div style="margin-top:10px;font-size:12px;color:#8b8ba7">${earlier} earlier run(s) on this card are kept in the card's own folder.</div>`
    : '';

  const stateBand = stopped
    ? '<div style="margin-top:8px;background:#2a2113;color:#e0b452;border-radius:8px;padding:8px 10px;font-size:13px">This run has stopped. Nothing is working on this card now, and everything below is how the team stood at its last minute.</div>'
    : readError
      ? `<div style="margin-top:8px;background:#3a2018;color:#ffb3b3;border-radius:8px;padding:8px 10px;font-size:13px">The team could not be read at ${esc2(new Date().toLocaleTimeString())}, so this window may be out of date: ${esc2(readError)}. The board is asked again every three seconds.</div>`
      : `<div style="margin-top:8px;background:#123528;color:#4fd08a;border-radius:8px;padding:8px 10px;font-size:13px">Agent working — this is live, read at ${esc2(readWords)} and read again every three seconds.</div>`;
  const head = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div style="font-size:16px"><b>AgentTeams activity</b> ${stopped ? '<span style="color:#8b8ba7">●</span>' : readError ? '<span style="color:#ffb3b3">●</span>' : '<span style="color:#4fd08a">●</span>'} <span style="font-size:11px;color:#8b8ba7">${esc2(readError ? 'read failed' : readWords ? 'read ' + readWords : 'not read yet')}</span></div>
      <div><button class="acc" onclick="teamToCard(${id})">Open the card instead</button>
      <button class="cx" onclick="closeTeam()" style="margin-left:8px">Close</button></div></div>
    <div style="border-top:1px solid #2b2b3c;margin-top:10px;padding-top:10px;font-size:12px;color:#8b8ba7">${esc2(card.key || data.card)} — ${esc2(card.title)} · ${esc2(stage(card.stage).name)}</div>`;
  const empty = readError ? ''
    : running
      ? `<div style="margin-top:8px;background:#123528;color:#bdf0d4;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55">The agent is working now and the team record is being written: nothing has been written into this card's own team folder yet. ${esc2(handNow || 'A hand')} holds the ${esc2(stageNow || 'stage')} stage${agentNow ? ' (' + esc2(agentNow) + ')' : ''} — ${esc2(holdsNow)}. This panel reads the record again every three seconds and fills the moment it lands.</div>`
      : '<div style="margin-top:16px;font-size:13px;color:#9aa0b4">No team record was ever written on this card.</div>';
  const liveBlock = stopped ? '' : `<div style="margin-top:8px;background:#0f2a20;border:1px solid #1f5a41;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55">
      <div><b>Agent at work:</b> ${esc2(handNow || 'a hand')} · ${esc2(stageNow || 'stage')}${agentNow ? ' (' + esc2(agentNow) + ')' : ''} · took it ${esc2(when(tookNow))}</div>
      <div><b>Holds:</b> ${esc2(holdsNow)}</div>
      ${lastWordNow ? `<div><b>Last word on the card, ${esc2(when(lastWordAt))}:</b> ${esc2(lastWordNow)}</div>` : ''}
      ${(picked[0] && picked[0].note) ? `<div style="color:#e0b452"><b>The board says:</b> ${esc2(picked[0].note)}</div>` : ''}
    </div>`;

  document.getElementById('teambody').innerHTML = head + liveBlock + stateBand
    + (picked.length ? rows : empty) + earlierLine;
  document.getElementById('teambody').setAttribute('data-card', String(id));
  document.getElementById('teamscreen').style.display = 'block';

  if (teamTicker) clearInterval(teamTicker);
  teamTicker = setInterval(() => {
    const sc = document.getElementById('teamscreen');
    if (!sc || sc.style.display === 'none') { clearInterval(teamTicker); teamTicker = null; return; }
    const y = sc.scrollTop;
    openTeam(id).then(() => {
      const sc2 = document.getElementById('teamscreen');
      if (sc2) sc2.scrollTop = y;
    });
  }, 3000);
}
function closeCard() {
  openId = null;
  document.getElementById('cardwrap').classList.remove('on');
  render();
}
let shownHtml = null;
let shownId = null;
function renderCard() {
  const wrap = document.getElementById('cardwrap');
  const box = document.getElementById('cardbox');
  if (openId == null) { wrap.classList.remove('on'); shownHtml = null; shownId = null; return; }
  const c = S.cards.find((x) => x.id === openId);
  if (!c) { closeCard(); return; }
  const st = stage(c.stage);
  const meta = c.kind === 'project'
    ? 'PROJECT · ' + (c.rag || 'NOT STATED') + ' · ' + (c.folder || '')
    : st.name + ' · ' + st.agent + (st.engine !== 'none' ? ' · ' + st.engine + ' · ' + st.where : '');
  const html = `<div class="chead">
      <span class="dot s-${c.stage}"></span>
      <h2>${esc(c.key || '#' + c.id)} — ${esc(c.title)}</h2>
      <span class="meta">${esc(meta)}</span>
      ${badge(c)}
      <button class="cx" onclick="closeCard()">Close</button>
    </div>
    <div class="cbody">${full(c)}</div>`;
  wrap.classList.add('on');
  if (shownId === openId && shownHtml === html) return;
  const same = shownId === openId;
  const was = box.querySelector('.cbody');
  const keep = same && was ? was.scrollTop : 0;
  const wasWord = box.querySelector('#word-' + c.id);
  const typed = wasWord ? wasWord.value : null;
  box.innerHTML = html;
  const isRunning = !!(S.cards.find((x) => x.id === openId) || {}).running;
  if (isRunning) refreshTeam(openId);
  const now = box.querySelector('.cbody');
  if (now && keep) now.scrollTop = keep;
  if (typed != null) { const t = box.querySelector('#word-' + c.id); if (t) t.value = typed; }
  shownHtml = html;
  shownId = openId;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (openId != null) closeCard(); else unpeek(); } });

async function refreshTeam(id) {
  const box = document.getElementById('team-' + id);
  if (!box) return;
  try {
    const r = await fetch('/api/team/' + id);
    const d = await r.json();
    const all = (d && d.teams) || [];
    const cur = all.filter((t) => t.current);
    const teams = cur.length ? cur : all.slice(0, 1);
    const lf = (d && d.live) || {};
    const actsBox = Array.isArray(card.activity) ? card.activity : [];
    const tookBox = [...actsBox].reverse().find((a) => a && /took /i.test(String(a.text || ''))) || null;
    const tookTxt = lf.tookAt ? new Date(lf.tookAt).toLocaleString() : tookBox && tookBox.at ? new Date(tookBox.at).toLocaleString() : '—';
    const liveLine = `<div class="line">· hand <b>${esc(lf.hand || card.hand || 'a hand')}</b> · ${esc(lf.stageName || stage(card.stage).name || '')}${lf.agent ? ' (' + esc(lf.agent) + ')' : ''} · took it ${esc(tookTxt)}</div>`
      + `<div class="line">· holds ${esc(lf.task || card.key || '')}</div>`;
    if (!teams.length) {
      box.innerHTML = '<label>Agent working — the team record is being written</label>' + liveLine;
      box.style.display = 'block';
      return;
    }
    box.innerHTML = `<label>Agent working — the team on this card now</label>` + liveLine + teams.map((t) => {
      const mem = (t.members || []).map((m) => `<div>· <b>${esc(m.name || 'a bee')}</b> — ${esc(m.role || '')} · ${esc(m.status || '')}${m.activity ? ' · ' + esc(m.activity) : ''}${m.model ? ' · ' + esc(m.model) : ''}</div>`).join('') || '<div>· no bee named yet</div>';
      const tk = (t.tasks || []).map((x) => `<div>· ${esc(x.id || '')} ${esc(String(x.subject || '').slice(0, 70))} — <b>${esc(x.status || '')}</b>${x.assignee ? ' → ' + esc(x.assignee) : ''}${x.dependencies && x.dependencies.length ? ' (waits ' + esc(x.dependencies.join(', ')) + ')' : ''}</div>`).join('') || '<div>· no task on the list yet</div>';
      return `<div class="line"><b>${esc(t.name || 'the team')}</b> · ${esc(t.phase || '')} · ${(t.members || []).length} bee(s) · ${(t.tasks || []).length} task(s)</div>
        <div class="line">${mem}</div>
        <div class="line">${tk}</div>`;
    }).join('');
    box.style.display = 'block';
  } catch (e) {
    box.style.display = 'none';
  }
}

function peek(id, e) {
  if (openId != null) return;
  const c = S.cards.find((x) => x.id === id);
  if (!c) return;
  const st = stage(c.stage);
  const box = document.getElementById('peek');
  box.innerHTML = `<h3>${esc(c.key || '#' + c.id)} — ${esc(c.title)}</h3>
    <div class="meta">${esc(st.name)} · ${esc(st.agent)}${c.actions && c.actions.length ? ' · ' + progress(c) + ' actions' : ''}${isGate(c) ? ' · WAITS ON YOU' : ''}${c.held ? ' · waits on ' + esc((c.waitingOn || []).join(', ')) : ''}</div>
    <p>${esc(c.body || 'Nothing written on this card yet.')}</p>`;
  box.style.display = 'block';
  const w = 380, h = box.offsetHeight;
  let x = e.clientX + 18, y = e.clientY + 14;
  if (x + w > window.innerWidth - 10) x = window.innerWidth - w - 10;
  if (y + h > window.innerHeight - 10) y = Math.max(10, window.innerHeight - h - 10);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
function unpeek() { document.getElementById('peek').style.display = 'none'; }
async function create() {
  const t = document.getElementById('title');
  if (!t.value.trim()) return;
  const series = (document.getElementById('series') || {}).value || 'WO';
  await fetch('/api/card', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: t.value, body: document.getElementById('body').value, series }) });
  t.value = ''; document.getElementById('body').value = '';
  document.getElementById('adder').classList.remove('on');
  load();
}
async function post(id, what, e, body) {
  if (e) e.stopPropagation();
  const r = await fetch(`/api/card/${id}/${what}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json();
  if (!r.ok) alert(d.moved?.why || d.error || 'refused');
  load();
}
async function putWord(id, e) {
  if (e) e.stopPropagation();
  const ta = document.getElementById('word-' + id);
  const r = await fetch(`/api/card/${id}/word`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: ta ? ta.value : '' }) });
  const d = await r.json();
  if (!r.ok) alert(d.error || 'refused');
  load();
}
async function putWaits(id, e) {
  if (e) e.stopPropagation();
  const el = document.getElementById('waits-' + id);
  const waitsOn = (el ? el.value : '').split(/[,\s]+/).map((x) => x.trim()).filter(Boolean);
  const r = await fetch(`/api/card/${id}/waits`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ waitsOn }) });
  const d = await r.json();
  if (!r.ok) alert(d.error || 'refused');
  load();
}
function destroy(id, e) {
  e.stopPropagation();
  if (!confirm('This one is gone off the disk for good. There is no undo. Are you sure?')) return;
  if (!confirm('Last check: delete it for good?')) return;
  post(id, 'destroy');
}
load().then(openTeamFromLink);
setInterval(() => load(false), 5000);
</script>
</body>
</html>
